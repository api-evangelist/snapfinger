name: Snapfinger
description: 'Snapfinger was an online and mobile food-ordering platform that let diners
  browse menus and place takeout and delivery orders across a network of restaurant
  brands. The snapfinger.com domain now 301-redirects to Tillster, the restaurant-commerce
  company (ordering, kiosk, loyalty, menu, and data solutions for 40,000+ restaurants),
  so Snapfinger operates today as a defunct brand absorbed into Tillster. No public
  API, developer portal, OpenAPI specification, or SDK surface is published under the
  Snapfinger name. It remains in the API Evangelist network as a Norwest Venture Partners
  portfolio lead pending any future developer surface.'
